name: Build and push

on:
  schedule:
    - cron: '0 16 * * *'   # daily at 4 PM UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Get WARP version
        id: warp
        run: |
          VERSION=$(curl -fsSL https://pkg.cloudflareclient.com/dists/noble/main/binary-amd64/Packages.gz \
            | gunzip | awk '/^Version:/ {print $2; exit}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version already published
        id: check
        run: |
          if docker manifest inspect ghcr.io/${{ github.repository }}:${{ steps.warp.outputs.version }} > /dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.warp.outputs.version }} already published, skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 for testing (native, no emulation)
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          load: true
          platforms: linux/amd64
          tags: warp:test
          build-args: VERSION=${{ steps.warp.outputs.version }}

      - name: Run integration tests
        if: steps.check.outputs.skip == 'false'
        run: bash test.sh --ci warp:test

      - name: Login to GHCR
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-arch image
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.warp.outputs.version }}
          build-args: VERSION=${{ steps.warp.outputs.version }}
