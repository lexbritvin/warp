services:
  warp:
    container_name: warp
    image: ghcr.io/lexbritvin/warp:latest
    restart: unless-stopped
    # Allow container to create /dev/net/tun (char device major:10 minor:200)
    device_cgroup_rules:
      - 'c 10:200 rwm'
    environment:
      WARP_ROUTING_OVERRIDE: "1"
      # WARP_DNS_EXPOSE: "1"
      # WARP_PROXY_EXPOSE: "1"        # also requires route_localnet sysctl below
      # WARP_LICENSE_KEY: ""
      # WARP_MODE: "tunnel_only"      # default
      # WARP_PROXY_PORT: "40000"
      # WARP_FAMILIES_MODE: "off"
      # WARP_CONSUMER_REGISTER: "1"
      # WARP_DEBUG_QLOG: "1"
    cap_add:
      - MKNOD         # create /dev/net/tun — Docker has it by default, required for Podman
      - AUDIT_WRITE   # warp-svc logging — Docker has it by default, required for Podman
      - NET_ADMIN     # nftables, TUN interface management
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0       # WARP requires IPv6
      - net.ipv4.conf.all.src_valid_mark=1     # required by WARP routing
      # Enable for TUN-based routing in attached containers (e.g. sing-box TUN mode):
      # - net.ipv4.ip_forward=1
      # - net.ipv6.conf.all.forwarding=1
      # Enable when WARP_PROXY_EXPOSE=1:
      # - net.ipv4.conf.all.route_localnet=1
    volumes:
      - ./data/warp:/var/lib/cloudflare-warp

  # Attach another container to use WARP as its network:
  # myapp:
  #   image: myapp
  #   network_mode: "service:warp"
  #   depends_on:
  #     warp:
  #       condition: service_healthy
